services:
  mariadb:
    image: mariadb
    container_name: mariadb
    environment:
      TZ : "Asia/Seoul"
      MARIADB_USER: ${DB_USERNAME}
      MARIA_DB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
      MARIADB_DATABASE: ${DB_DATABASE}
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-uroot", "-p1234"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli","ping" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
  
  http-service:
    build:
      context: ../server
      target: builder
    command: sh -c "npm i && npm run start"
    environment:
      NODE_ENV: development
      APP_PORT: ${APP_PORT}
      SOCKET_PORTS: "8081,8082"
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
    volumes:
      - ../server:/app
      - /app/node_modules
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      mariadb :
        condition: service_healthy
  
  ws-service-1:
    build:
      context: ../server
      target: builder
    command: sh -c "npm i && npm run start"
    environment:
      NODE_ENV: development
      APP_PORT: ${APP_PORT}
      SOCKET_PORTS: "8081"
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      INSTANCE_NAME: "ws-service-1"
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
    volumes:
      - ../server:/app
      - /app/node_modules
    depends_on:
      redis:
        condition: service_healthy
      mariadb :
        condition: service_healthy

  ws-service-2:
    build:
      context: ../server
      target: builder
    command: sh -c "npm i && npm run start"
    environment:
      NODE_ENV: development
      APP_PORT: ${APP_PORT}
      SOCKET_PORTS: "8082"
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      INSTANCE_NAME: "ws-service-2"
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
    volumes:
      - ../server:/app
      - /app/node_modules
    depends_on:
      redis:
        condition: service_healthy
      mariadb :
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ws-service-1
      - ws-service-2

  client:
    build:
      context: ../client
      target: builder
    command: sh -c "npm i && npm run start"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_BACK_END_URL: ${BACK_END_URL}
      NEXT_PUBLIC_REACT_APP_URL: ${NEXT_PUBLIC_REACT_APP_URL}
    volumes:
      - ../client:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      mariadb :
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ../prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3001:3001"
